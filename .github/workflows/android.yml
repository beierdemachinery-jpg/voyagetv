name: Android Build

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true

      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          curl -sSLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee /tmp/build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoyageTV-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "运行页：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /tmp/body.md
          echo >> /tmp/body.md
          echo '### 编译错误（e: 行）' >> /tmp/body.md
          echo '```' >> /tmp/body.md
          grep -E "^e: " /tmp/build.log | head -60 >> /tmp/body.md || echo "no e: lines" >> /tmp/body.md
          echo '```' >> /tmp/body.md
          echo >> /tmp/body.md
          echo '### 末尾 40 行' >> /tmp/body.md
          echo '```' >> /tmp/body.md
          tail -40 /tmp/build.log >> /tmp/body.md || true
          echo '```' >> /tmp/body.md
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Android 编译失败 #${{ github.run_number }}" \
            --body-file /tmp/body.md || true
