name: AVProbe

# 真机级诊断：在 GitHub 的 macOS 机器上用真实 AVFoundation 播一个地址，
# 打印 item.status / error / errorLog，并保留 CFNETWORK 的 HTTP 交互诊断，
# 用来定位"播不了"的根因。
# 报告会以 Issue 形式发布（仓库日志需要登录态，Issue 可以匿名读）。
on:
  push:
    paths:
      - 'Tools/**'
      - 'VoyageTV/Services/HLSResourceLoader.swift'
      - '.github/workflows/avprobe.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Reachability from runner
        run: |
          set +e
          {
            echo "### 0) 从 runner 直接抓源（排除地域/网络因素）"
            echo '```'
            curl -sS -m 20 -o /tmp/pl.txt -w "playlist http=%{http_code} type=%{content_type} size=%{size_download} time=%{time_total}\n" "http://nas.vipgoodmedical.com:1122/ysp.php?id=cctv1"
            SEG=$(grep -Eo 'http://.*\.ts' /tmp/pl.txt | head -1)
            echo "segment=${SEG:0:80}..."
            curl -sS -m 30 -r 0-99 -o /dev/null -w "segment(0-99) http=%{http_code} type=%{content_type} size=%{size_download} time=%{time_total} range=%{starttransfer_time}\n" "$SEG"
            curl -sS -m 30 -o /dev/null -w "segment(full) http=%{http_code} type=%{content_type} size=%{size_download} time=%{time_total}\n" "$SEG"
            echo '```'
          } > report.md
          cat report.md

      - name: Build probe
        run: |
          mkdir -p build
          xcrun swiftc -O VoyageTV/Services/HLSResourceLoader.swift Tools/AVProbe/main.swift -o build/avprobe -framework AVFoundation

      - name: Probe with CFNETWORK diagnostics
        run: |
          set +e
          {
            echo "### 1) 用户源 + 资源加载器（CFNETWORK_DIAGNOSTICS=3）"
            echo '```'
            CFNETWORK_DIAGNOSTICS=3 PROBE_URL="http://nas.vipgoodmedical.com:1122/ysp.php?id=cctv1" PROBE_MODE=loader \
              ./build/avprobe 2> /tmp/diag.log
            echo "exit=$?"
            echo '```'
            echo "### 1b) 诊断日志关键片段"
            echo '```'
            grep -Ei 'segment|\.ts|error|fail|status|content-type|host|geo|timeout|403|404' /tmp/diag.log | tail -n 120
            echo '```'
            echo "### 2) 用户源 + 原生直连"
            echo '```'
            CFNETWORK_DIAGNOSTICS=3 PROBE_URL="http://nas.vipgoodmedical.com:1122/ysp.php?id=cctv1" PROBE_MODE=direct \
              ./build/avprobe 2> /tmp/diag2.log
            echo "exit=$?"
            echo '```'
            echo "### 2b) 诊断日志关键片段"
            echo '```'
            grep -Ei 'segment|\.ts|error|fail|status|content-type|host|geo|timeout|403|404' /tmp/diag2.log | tail -n 120
            echo '```'
          } >> report.md
          echo "REPORT_BYTES=$(wc -c < report.md)"

      - name: Publish report as issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f report.md ]; then echo "no report"; exit 0; fi
          jq -n --arg t "AVProbe 报告 #${{ github.run_number }}" --rawfile b report.md '{title:$t, body:$b}' > payload.json
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d @payload.json | head -c 300
