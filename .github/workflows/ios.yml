name: iOS Build

# 没有 Mac 也能编译：GitHub 免费提供 macOS 运行器。
# macos-14 镜像已于 2026-11-02 下线，必须用 macos-latest。
#
# 失败时会把编译错误自动发布成 Issue（公开仓库可直接读取），
# 这样不需要下载 80KB 的日志包也能看到具体报错。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Build & Test (simulator)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la

      - name: Build for simulator (compile check)
        run: |
          set -o pipefail
          xcodebuild build \
            -project VoyageTV.xcodeproj \
            -scheme VoyageTV \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Publish compile errors as issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.run_number }}
        run: |
          {
            echo "工作流第 ${RUN} 次运行失败，以下是从 build.log 中提取的报错："
            echo
            echo '```'
            grep -E "error:" build.log | head -50 || echo "(no 'error:' lines found)"
            echo '```'
            echo
            echo "### 最后 40 行上下文"
            echo '```'
            tail -40 build.log
            echo '```'
          } > issue_body.md
          jq -n --arg t "编译失败 #${RUN}" --rawfile b issue_body.md '{title:$t, body:$b}' > payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d @payload.json | jq -r '.html_url // .message'

      - name: Run unit tests
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j \
            | python3 -c "import sys,json;d=json.load(sys.stdin)['devices'];print(next((x['name'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')),''))")
          echo "simulator: $DEVICE"
          xcodebuild test \
            -project VoyageTV.xcodeproj \
            -scheme VoyageTV \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            {
              echo "单测失败（不阻断出包），以下是失败明细："
              echo
              echo '```'
              grep -E "(error:|failed|XCTAssert)" test.log | head -40
              echo '```'
            } > test_body.md
            jq -n --arg t "单测失败 #${GITHUB_RUN_NUMBER}" --rawfile b test_body.md '{title:$t, body:$b}' > test_payload.json
            curl -sS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/issues" \
              -d @test_payload.json > /dev/null || true
          fi
          exit 0

      - name: Archive unsigned (.app)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project VoyageTV.xcodeproj \
            -scheme VoyageTV \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/VoyageTV.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" 2>&1 | tee archive.log
          exit ${PIPESTATUS[0]}

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/VoyageTV.xcarchive/Products/Applications/VoyageTV.app build/Payload/
          cd build
          zip -qry VoyageTV-unsigned.ipa Payload
          ls -lh VoyageTV-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoyageTV-unsigned-ipa
          path: build/VoyageTV-unsigned.ipa
          if-no-files-found: warn

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            test.log
            archive.log
          if-no-files-found: ignore
