name: iOS Build

# 没有 Mac 也能编译：GitHub 免费提供 macOS 运行器。
# 注意：macos-14 镜像已于 2026-11-02 下线，必须用 macos-latest / macos-15 / macos-26。
#
# 设计要点：每步的报错都会写进 $GITHUB_STEP_SUMMARY，运行摘要页可直接看到
# 具体的 error 行，不用登录下载日志。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (simulator)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: List available simulators
        run: xcrun simctl list devices available | head -30

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la

      - name: Run unit tests
        continue-on-error: true
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j \
            | python3 -c "import sys,json;d=json.load(sys.stdin)['devices'];print(next((x['name'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')),''))")
          echo "simulator: $DEVICE"
          xcodebuild test \
            -project VoyageTV.xcodeproj \
            -scheme VoyageTV \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            {
              echo "### 单测失败（不阻断出包）"
              grep -E "error:|failed" test.log | head -30
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Build for simulator (compile check)
        run: |
          set -o pipefail
          xcodebuild build \
            -project VoyageTV.xcodeproj \
            -scheme VoyageTV \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            {
              echo "### 编译失败 · 错误清单"
              echo '```'
              grep -E "error:" build.log | head -40
              echo '```'
              echo "### 上下文（最后 30 行）"
              echo '```'
              tail -30 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      - name: Archive unsigned (.app)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project VoyageTV.xcodeproj \
            -scheme VoyageTV \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/VoyageTV.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" 2>&1 | tee archive.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            {
              echo "### 归档失败"
              echo '```'
              grep -E "error:" archive.log | head -30
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/VoyageTV.xcarchive/Products/Applications/VoyageTV.app build/Payload/
          cd build
          zip -qry VoyageTV-unsigned.ipa Payload
          ls -lh VoyageTV-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoyageTV-unsigned-ipa
          path: build/VoyageTV-unsigned.ipa
          if-no-files-found: warn

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            test.log
            archive.log
          if-no-files-found: ignore
