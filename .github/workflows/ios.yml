name: iOS Build

# 没有 Mac 也能编译：GitHub 免费提供 macOS 运行器。
# 手动触发或推送到 main 时，会依次做三件事：
#   1. 单元测试（iPhone 15 模拟器）
#   2. 模拟器编译（验证整包能编过）
#   3. 打包未签名 IPA（下载后用 Sideloadly 在 Windows 上签名装到 iPhone）
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (simulator)
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd "$GITHUB_WORKSPACE"
          xcodegen generate
          ls -la

      - name: Run unit tests
        # 单测失败不阻断出包：先拿到 IPA，测试问题单独修
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project VoyageTV.xcodeproj \
            -scheme VoyageTV \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Build for simulator (compile check)
        run: |
          set -o pipefail
          xcodebuild build \
            -project VoyageTV.xcodeproj \
            -scheme VoyageTV \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive unsigned (.app)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project VoyageTV.xcodeproj \
            -scheme VoyageTV \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/VoyageTV.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/VoyageTV.xcarchive/Products/Applications/VoyageTV.app build/Payload/
          cd build
          zip -qry VoyageTV-unsigned.ipa Payload
          ls -lh VoyageTV-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoyageTV-unsigned-ipa
          path: build/VoyageTV-unsigned.ipa
          if-no-files-found: warn

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/DerivedData/Logs
          if-no-files-found: ignore
