name: iOS Build

# 没有 Mac 也能编译：GitHub 免费提供 macOS 运行器。
# 注意：macos-14 镜像已于 2026-11-02 下线，必须用 macos-latest / macos-15 / macos-26。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (simulator)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcode-select -p

      - name: List available simulators
        run: xcrun simctl list devices available | head -40

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la

      - name: Run unit tests
        # 单测失败不阻断出包：先拿到 IPA，测试问题单独修
        continue-on-error: true
        run: |
          DEVICE=$(xcrun simctl list devices available -j \
            | python3 -c "import sys,json;d=json.load(sys.stdin)['devices'];print(next((x['name'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')),''))")
          echo "using simulator: $DEVICE"
          xcodebuild test \
            -project VoyageTV.xcodeproj \
            -scheme VoyageTV \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Build for simulator (compile check)
        run: |
          xcodebuild build \
            -project VoyageTV.xcodeproj \
            -scheme VoyageTV \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive unsigned (.app)
        run: |
          xcodebuild archive \
            -project VoyageTV.xcodeproj \
            -scheme VoyageTV \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/VoyageTV.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/VoyageTV.xcarchive/Products/Applications/VoyageTV.app build/Payload/
          cd build
          zip -qry VoyageTV-unsigned.ipa Payload
          ls -lh VoyageTV-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoyageTV-unsigned-ipa
          path: build/VoyageTV-unsigned.ipa
          if-no-files-found: warn

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/DerivedData/Logs
          if-no-files-found: ignore
