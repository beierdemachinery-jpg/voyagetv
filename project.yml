name: VoyageTV
options:
  bundleIdPrefix: com.voyagetv
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    # 在 Xcode 中或在这里填入你的 Team ID，例如 ABCDE12345
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  VoyageTV:
    type: application
    platform: iOS
    sources:
      - path: VoyageTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voyagetv.app
        PRODUCT_NAME: VoyageTV
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/VoyageTV.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - sdk: CarPlay.framework
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework

  VoyageTVTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VoyageTVTests
    dependencies:
      - target: VoyageTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voyagetv.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VoyageTV.app/VoyageTV"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  VoyageTV:
    build:
      targets:
        VoyageTV: all
        VoyageTVTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - VoyageTVTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
